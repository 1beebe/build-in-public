name = "slop-cannon"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# Public settings. Secrets (BUFFER_CLIENT_SECRET, TOKEN_KEY) are set in the
# Cloudflare dashboard or with `wrangler secret put`, never committed.
[vars]
APP_URL = "https://slopcannon.lbeebe.com"
BUFFER_CLIENT_ID = "H3kKwv_riHF3jA7XwVD-RAl-8IE9KvdC2gqNrEcclde"

[[kv_namespaces]]
binding = "SESSIONS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[observability]
enabled = true

[assets]
directory = "./public"
