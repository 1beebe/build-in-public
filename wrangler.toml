name = "interviewer"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# Public, non-secret settings. Secrets (BUFFER_CLIENT_SECRET, TOKEN_KEY, and the
# optional GITHUB_TOKEN and ANTHROPIC_API_KEY) are set in the Cloudflare dashboard
# or with `wrangler secret put`, never committed.
[vars]
APP_URL = "https://interviewer.lbeebe.com"
BUFFER_CLIENT_ID = "gWeAUTXEWPQCHFuC5MvkLI4HQMUcxb0odcMQOqNr2DB"

[[kv_namespaces]]
binding = "SESSIONS"
id = "44870f3b03c24272a3ecfda1224a1356"

[observability]
enabled = true

# Landing photos and other static files, served before the Worker runs.
[assets]
directory = "./public"
